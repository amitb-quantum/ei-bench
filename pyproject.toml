[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eibench"
version = "0.1.0"
description = "EI-Bench v0: operational criteria for emergent intelligence"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.setuptools]
packages = ["eibench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
